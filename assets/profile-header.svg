    <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#0A8EA6">SREE SANKARAN CHACKOTH · APPLIED ML &amp; AGENTIC AI · OTTAWA</text>
    <text x="60" y="166" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3" fill="#0E1226">I build AI systems</text>
    <text x="60" y="246" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3" fill="#0E1226">that <tspan fill="url(#g)">ship.</tspan><tspan fill="#E5187A">_</tspan></text>
    <text x="64" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#5B6480">PYTHON · PYTORCH · YOLO/OCR · LANGGRAPH · MICROSOFT FOUNDRY · RAG · MCP · AWS</text>
    <g stroke="#00B8D4" stroke-opacity="0.55" fill="none" stroke-width="1.5">
      <path d="M960 120L1050 80L1130 140L1190 90M1050 80L1080 190L1130 140M1080 190L980 230L960 120M980 230L1060 290L1160 250L1130 140M1160 250L1220 200L1190 90"/>
