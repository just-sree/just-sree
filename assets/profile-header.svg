    <g fill="#0A8EA6"><circle cx="960" cy="120" r="6"/><circle cx="1130" cy="140" r="6"/><circle cx="980" cy="230" r="5"/><circle cx="1160" cy="250" r="6"/><circle cx="1190" cy="90" r="5"/><circle cx="1220" cy="200" r="5"/></g>
    <g fill="#E5187A"><circle cx="1050" cy="80" r="7"/><circle cx="1080" cy="190" r="8"/><circle cx="1060" cy="290" r="6"/></g>
