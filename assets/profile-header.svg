<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Sree Sankaran Chackoth — From hard problems to working AI.</title>
  <desc id="description">A forest-green editorial banner with a lime-accented system diagram connecting context, tools, and evaluation.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8caa87" opacity="0.2" />
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#18392b" />
    <rect x="760" width="520" height="360" fill="url(#grid)" />
    <path d="M58 54 H84 M71 41 V67" stroke="#d6e99c" stroke-width="2" />
    <text x="104" y="61" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2" fill="#dce6d0">SREE SANKARAN CHACKOTH</text>
    <text x="56" y="160" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="600" letter-spacing="-2.5" fill="#f5f5ed">From hard problems</text>
    <text x="56" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-style="italic" letter-spacing="-2" fill="#d6e99c">to working AI.</text>
    <path d="M58 281 H703" stroke="#42604a" />
    <text x="58" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.5" fill="#b6c9ab">UNDERSTAND THE WORKFLOW. BUILD THE SYSTEM.</text>
    <g fill="none" stroke="#6a8760">
      <circle cx="1020" cy="180" r="130" stroke-dasharray="3 7" opacity="0.65" />
      <circle cx="1020" cy="180" r="91" opacity="0.45" />
      <path d="M1020 50 V134 M974 180 H902 Q874 180 874 210 V263 M1066 180 H1139 Q1165 180 1165 210 V263" />
      <path d="M897 289 H1144" stroke-dasharray="4 7" opacity="0.55" />
    </g>
    <circle cx="1020" cy="180" r="47" fill="#2b4b35" stroke="#84995a" />
    <g stroke="#d6e99c" stroke-width="2.5">
      <path d="M1020 153 V207 M993 180 H1047 M1001 161 L1039 199 M1001 199 L1039 161" />
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1" text-anchor="middle">
      <rect x="956" y="28" width="128" height="43" rx="5" fill="#264633" stroke="#66815a" />
      <text x="1020" y="55" fill="#e2e9d8">CONTEXT</text>
      <rect x="813" y="264" width="127" height="43" rx="5" fill="#264633" stroke="#66815a" />
      <text x="877" y="291" fill="#e2e9d8">TOOLS</text>
      <rect x="1083" y="264" width="161" height="43" rx="5" fill="#d6e99c" />
      <text x="1163" y="291" fill="#18392b">EVALUATION</text>
    </g>
    <circle cx="1150" cy="180" r="5" fill="#d6e99c" />
    <circle cx="929" cy="180" r="4" fill="#d6e99c" />
  </g>
</svg>
