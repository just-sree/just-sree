<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title description">
  <title id="title">$ whoami: Sree Sankaran Chackoth, ML engineer in Ottawa</title>
  <desc id="description">A dark terminal banner with a green prompt, matching the portfolio site.</desc>
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
