<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Sree Sankaran Chackoth — I build AI systems that ship.</title>
  <desc id="description">A light banner with a cyan-to-magenta gradient, a faint grid, and a small network diagram.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A8EA6"/><stop offset="1" stop-color="#E5187A"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0E1226" stroke-opacity="0.07"/></pattern>
    <clipPath id="frame"><path d="M22 0H1258L1280 22V338L1258 360H22L0 338V22Z"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
