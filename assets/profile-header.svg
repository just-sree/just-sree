    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="1278" height="298" rx="10" fill="#0D0F0D" stroke="#242A24" stroke-width="2"/>
  <text y="84" font-size="26"><tspan x="64" fill="#86D96B" font-weight="700">$</tspan><tspan x="95" fill="#D6D9D2">whoami</tspan></text>
  <text x="64" y="158" font-size="56" font-weight="700" fill="#D6D9D2">Sree Sankaran Chackoth</text>
  <text x="64" y="210" font-size="24" fill="#7C8379">ML engineer in Ottawa. Forecasting, agent systems, computer vision.</text>
  <text x="64" y="262" font-size="26" font-weight="700" fill="#86D96B">$</text>
